        overflow: hidden;
      }
      #app-splash-screen.loaded {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      /* Hide static navbar logo during flight animation to prevent double-vision ghosting */
      body.splash-active .navbar__logo-group {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      .splash-brand-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        transform: scale(1.6);
        transform-origin: 0 0;
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        transition: transform 0.85s cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* Animated Flight to Navbar Top-Left Corner */
      #app-splash-screen.animating {
        background-color: transparent;
      }
      #app-splash-screen.animating .splash-brand-group {
        transform: translate3d(var(--target-x, 0px), var(--target-y, 0px), 0) scale(var(--target-scale, 1));

    <script>
      // 100% Isomorphic Logo Flight Animation (Mobile & Desktop Responsive)
      function runLogoFlightAnimation() {
        var splash = document.getElementById('app-splash-screen');
        var splashBrand = document.getElementById('splash-brand-group');

        if (!splash || !splashBrand) return;

        // Find the currently VISIBLE navbar logo (handles mobile vs desktop headers)
        var allLogos = document.querySelectorAll('.navbar__logo-group');
        var navLogo = null;
        for (var i = 0; i < allLogos.length; i++) {
          var r = allLogos[i].getBoundingClientRect();
          if (r.width > 0 && r.height > 0) {
            navLogo = allLogos[i];
            break;
          }
        }

        if (navLogo) {
          var navRect = navLogo.getBoundingClientRect();
          var splashRect = splashBrand.getBoundingClientRect();

          if (navRect.width > 0 && navRect.height > 0 && splashRect.width > 0) {
            var deltaX = navRect.left - splashRect.left;
            var deltaY = navRect.top - splashRect.top;
            var scale = navRect.height / splashRect.height;

            splash.style.setProperty('--target-x', deltaX + 'px');
            splash.style.setProperty('--target-y', deltaY + 'px');
            splash.style.setProperty('--target-scale', scale);
          }
        }

        splash.classList.add('animating');

        // At 850ms (exact 0.85s flight completion): 0ms atomic handoff!
        // Hide splash container and reveal static navbar logo in the exact same frame!
        setTimeout(function() {
          splash.classList.add('loaded');
          document.body.classList.remove('splash-active');
        }, 850);
      }

      // Initial presentation wait time: 3.2 seconds (3200ms) as requested
      setTimeout(runLogoFlightAnimation, 3200);
    </script>
