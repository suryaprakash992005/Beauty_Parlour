    <script>
      // Smooth Logo Flight Animation from center screen to Navbar logo (top-left)
      function runLogoFlightAnimation() {
        var splash = document.getElementById('app-splash-screen');
        var splashBrand = document.getElementById('splash-brand-group');
        var navLogo = document.querySelector('.navbar__logo-group');

        if (!splash || !splashBrand) return;

        if (navLogo) {
          var navRect = navLogo.getBoundingClientRect();
          var splashRect = splashBrand.getBoundingClientRect();

          if (navRect.width > 0 && navRect.height > 0) {
            var deltaX = navRect.left + (navRect.width / 2) - (splashRect.left + (splashRect.width / 2));
            var deltaY = navRect.top + (navRect.height / 2) - (splashRect.top + (splashRect.height / 2));
            var scale = navRect.height / splashRect.height;

            splash.style.setProperty('--target-x', deltaX + 'px');
            splash.style.setProperty('--target-y', deltaY + 'px');
            splash.style.setProperty('--target-scale', Math.max(0.35, Math.min(0.85, scale)));
          }
        }

        splash.classList.add('animating');

        setTimeout(function() {
          splash.classList.add('loaded');
        }, 900);
      }

      // Trigger logo flight after short initial splash presentation
      window.addEventListener('load', function() {
        setTimeout(runLogoFlightAnimation, 450);
      });

      // Fallback timer if load event is delayed
      setTimeout(function() {
        var splash = document.getElementById('app-splash-screen');
        if (splash && !splash.classList.contains('animating')) {
          runLogoFlightAnimation();
        }
      }, 1000);
    </script>
