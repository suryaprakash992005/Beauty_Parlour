        opacity: 0;
        visibility: hidden;

      /* Hide static navbar logo during flight animation to prevent double-vision ghosting */
      body.splash-active .navbar__logo-group {
        opacity: 0 !important;
        transition: opacity 0.2s ease-in-out;
      }

      .splash-brand-group {
        display: flex;

        align-items: center;
        gap: 19.2px;

      /* Animated Flight transforms applied individually to circle and text */
      #app-splash-screen.animating .splash-logo-circle {
        animation: none !important; /* Release transform lock from keyframe animation during flight */
        transform: translate3d(var(--c-x, 0px), var(--c-y, 0px), 0) scale(var(--c-scale, 1));
      }
      #app-splash-screen.animating .splash-text-wrap {
        transform: translate3d(var(--t-x, 0px), var(--t-y, 0px), 0) scale(var(--t-scale, 1));

    <script>
      // 100% Isomorphic Logo Flight Animation (Mobile & Desktop Responsive)
      function runLogoFlightAnimation() {
        var splash = document.getElementById('app-splash-screen');
        var splashCircle = document.querySelector('#app-splash-screen .splash-logo-circle');
        var splashText = document.querySelector('#app-splash-screen .splash-text-wrap');

        if (!splash || !splashCircle || !splashText) return;

        // Find the currently VISIBLE navbar logo (handles mobile vs desktop headers)
        var allLogos = document.querySelectorAll('.navbar__logo-group');
        var navLogo = null;
        for (var i = 0; i < allLogos.length; i++) {
          var r = allLogos[i].getBoundingClientRect();
          if (r.width > 0 && r.height > 0) {
            navLogo = allLogos[i];
            break;
          }
        }

        if (navLogo) {
          var navCircle = navLogo.querySelector('.navbar__logo-circle');
          var navText = navLogo.querySelector('.navbar__logo-text-wrap');

          if (navCircle && navText) {
            var navCircleRect = navCircle.getBoundingClientRect();
            var splashCircleRect = splashCircle.getBoundingClientRect();
            var navTextRect = navText.getBoundingClientRect();
            var splashTextRect = splashText.getBoundingClientRect();

            // Calculate translation and scale for the logo circle
            var cX = navCircleRect.left - splashCircleRect.left;
            var cY = navCircleRect.top - splashCircleRect.top;
            var cScale = navCircleRect.width / splashCircleRect.width;

            // Calculate translation and scale for the text wrap
            var tX = navTextRect.left - splashTextRect.left;
            var tY = navTextRect.top - splashTextRect.top;
            var tScale = navTextRect.height / splashTextRect.height;

            splash.style.setProperty('--c-x', cX + 'px');
            splash.style.setProperty('--c-y', cY + 'px');
            splash.style.setProperty('--c-scale', cScale);

            splash.style.setProperty('--t-x', tX + 'px');
            splash.style.setProperty('--t-y', tY + 'px');
            splash.style.setProperty('--t-scale', tScale);
          }
        }

        splash.classList.add('animating');

        // End-of-animation handoff timing optimization: 850ms (matches CSS transition exactly to avoid lag)
        setTimeout(function() {
          splash.classList.add('loaded');
          document.body.classList.remove('splash-active');
        }, 850);
      }

      // Initial presentation wait time: 3.2 seconds (3200ms) as requested
      setTimeout(runLogoFlightAnimation, 3200);
    </script>
